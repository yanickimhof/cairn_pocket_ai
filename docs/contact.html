<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cairn: a question or a suggestion</title>
<style>
:root{color-scheme:light dark;--bg:#FBFBFD;--card:#fff;--ink:#1D1D1F;--mute:#6E6E73;--accent:#3368A0;--line:#E5E5EA}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--ink:#F5F5F7;--mute:#A1A1A6;--accent:#6FA3DB;--line:#2C2C2E}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:64px 24px}
h1{font-size:32px;letter-spacing:-.02em;margin:0 0 4px;color:var(--accent)}
p{color:var(--mute);margin:0 0 28px}
.card{background:var(--card);border-radius:20px;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 30px rgba(0,0,0,.06)}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:0 0 6px}
input,textarea{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);background:var(--card);margin:0 0 18px}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:140px;resize:vertical}
button{min-height:44px;padding:0 24px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:600 15px inherit;cursor:pointer}
.note{margin-top:20px;font-size:14px;color:var(--mute)}
a{color:var(--accent)}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<main>
<h1>Cairn</h1>
<p>A question or a suggestion? Write here.</p>
<form class="card" action="https://formspree.io/f/myeepadb" method="POST">
<label for="email">Your email, so that I can answer (optional)</label>
<input id="email" name="email" type="email" autocomplete="email">
<label for="message">Your message</label>
<textarea id="message" name="message" required></textarea>
<input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
<button type="submit">Send</button>
</form>
<p class="note">This page sends your message through Formspree, a form service, from your browser. Cairn itself sends nothing and knows nothing about it. Please do not write anything private about your recordings. <a href="https://github.com/yanickimhof/cairn_pocket_ai">Back to Cairn</a></p>
</main>
</body>
</html>
