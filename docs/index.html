<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cairn: install</title>
<style>
:root{color-scheme:light dark;--bg:#FBFBFD;--card:#fff;--ink:#1D1D1F;--mute:#6E6E73;--accent:#3368A0;--line:#E5E5EA;--code:#F2F2F7}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--ink:#F5F5F7;--mute:#A1A1A6;--accent:#6FA3DB;--line:#2C2C2E;--code:#2C2C2E}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:64px 24px}
h1{font-size:32px;letter-spacing:-.02em;margin:0 0 4px;color:var(--accent)}
p{color:var(--mute);margin:0 0 28px}
.card{background:var(--card);border-radius:20px;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 30px rgba(0,0,0,.06)}
.label{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:8px}
pre{margin:0 0 16px;background:var(--code);border-radius:12px;padding:14px 16px;overflow-x:auto;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
button{min-height:44px;padding:0 20px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:600 15px inherit;cursor:pointer}
.alt{margin-top:24px;font-size:14px;color:var(--mute)}
a{color:var(--accent)}
.spec{margin-top:16px}table{width:100%;border-collapse:collapse;font-size:14px}td{padding:8px 0;border-top:1px solid var(--line)}td:last-child{text-align:right;color:var(--mute);white-space:nowrap}.min{font-size:14px;margin:0 0 12px;color:var(--ink)}</style>
</head>
<body>
<main>
<h1>Cairn</h1>
<p>Sovereign Pocket AI. Everything stays on your computer.</p>
<div class="card">
<div class="label" id="label">Your install command</div>
<pre id="cmd"></pre>
<button id="copy" type="button">Copy</button>
<div class="alt" id="alt"></div>
</div>
<div class="card spec"><div class="label">What it installs</div><p class="min" id="min"></p><table id="spec"></table></div><p class="alt" style="margin-top:24px">The command downloads and sets up everything in your own folder, with no administrator rights. <a href="https://github.com/yanickimhof/cairn_pocket_ai/blob/main/SECURITY.md">Read before you run</a> · <a href="https://github.com/yanickimhof/cairn_pocket_ai">Source</a></p>
</main>
<script>
var base = "https://raw.githubusercontent.com/yanickimhof/cairn_pocket_ai/v0.7.0/";
var cmds = {
  sh: { label: "Terminal (bash or zsh)", text: "curl --proto '=https' --tlsv1.2 -fsSL " + base + "install.sh | bash" },
  ps: { label: "PowerShell", text: "irm " + base + "install.ps1 | iex" }
};
var ua = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent || "";
var key = /win/i.test(ua) ? "ps" : "sh";
var specs = {
  sh: { min: "Minimum: macOS 14 or later, Apple silicon recommended. About 4.8 GB of disk.", rows: [["Whisper large-v3-turbo (speech)", "1.6 GB"], ["Qwen3 4B (language model)", "2.5 GB"], ["Ollama (model server)", "0.2 GB"], ["Python 3.11 and packages", "0.4 GB"]] },
  ps: { min: "Minimum: Windows 10 22H2 or later. About 7 GB of disk (estimate).", rows: [["Whisper large-v3-turbo (speech)", "1.6 GB"], ["Qwen3 4B (language model)", "2.5 GB"], ["Ollama (model server)", "1.7 GB download, about 4 GB installed"], ["Python 3.11 and packages", "About 1 GB"]] }
};
function showSpec(k) {
  document.getElementById("min").textContent = specs[k].min;
  var t = document.getElementById("spec");
  t.textContent = "";
  specs[k].rows.forEach(function (r) {
    var tr = document.createElement("tr");
    r.forEach(function (c) { var td = document.createElement("td"); td.textContent = c; tr.appendChild(td); });
    t.appendChild(tr);
  });
}
function show(k) {
  showSpec(k);
  document.getElementById("label").textContent = cmds[k].label;
  document.getElementById("cmd").textContent = cmds[k].text;
  var other = k === "ps" ? "sh" : "ps";
  var alt = document.getElementById("alt");
  alt.textContent = "";
  var a = document.createElement("a");
  a.href = "#"; a.textContent = "Show the " + cmds[other].label + " command";
  a.onclick = function (e) { e.preventDefault(); show(other); };
  alt.appendChild(a);
}
document.getElementById("copy").onclick = function () {
  var b = this, t = document.getElementById("cmd").textContent;
  if (navigator.clipboard) { navigator.clipboard.writeText(t).then(function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1500); }); }
};
show(key);
</script>
</body>
</html>
